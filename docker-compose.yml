services:
  db:
    image: postgres:16-alpine
    container_name: saas-directory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_directory
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: saas-directory-web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/saas_directory
      - BETTER_AUTH_SECRET=dev-secret-key-do-not-use-in-production
      - BETTER_AUTH_URL=http://localhost:3000
      - RESEND_API_KEY=dev-resend-key
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "next", "dev", "--webpack"]
    stdin_open: true
    tty: true

volumes:
  postgres_data:
